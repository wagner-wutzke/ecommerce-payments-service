server:
  port: ${APP_PORT:9030}
spring:
  application:
    name: payments-service
  datasource:
    url: jdbc:h2:file:./data/payments-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      settings.web-allow-others: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payments-events-group.v1}
      properties:
        spring.json.trusted.packages: "net.wowdev.ecommerce.domain.events"
        retry.backoff.ms: 3000
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 15000
        linger.ms: 0

app:
  kafka:
    orders-topic: ${KAFKA_ORDERS_TOPIC:orders-topic.v1}
    customers-topic: ${KAFKA_CUSTOMERS_TOPIC:customers-topic.v1}
    inventory-topic: ${KAFKA_INVENTORY_TOPIC:inventory-topic.v1}
    payments-topic: ${KAFKA_PAYMENTS_TOPIC:payments-topic.v1}
    invoices-topic: ${KAFKA_INVOICES_TOPIC:invoices-topic.v1}
    shipments-topic: ${KAFKA_SHIPMENTS_TOPIC:shipments-topic.v1}

    payments-event-listener-id: ${KAFKA_PAYMENT_LISTENER_ID:payments-event-listener-id}

    retry:
      max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
      multiplier: ${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${KAFKA_CONSUMER_RETRY_MAX_INTERVAL_MS:30000}
      circuit-breaker-open:
        # Keep this longer than resilience4j.circuitbreaker.instances.*.waitDurationInOpenState.
        initial-interval-ms: ${KAFKA_CIRCUIT_BREAKER_RETRY_INITIAL_INTERVAL_MS:16000}
        max-interval-ms: ${KAFKA_CIRCUIT_BREAKER_RETRY_MAX_INTERVAL_MS:60000}

  service:
    payments.failing: ${SERVICE_PAYMENTS_FAILING:false}

resilience4j:
  circuitbreaker:
    instances:
      ecommerceCircuitBreakerGateway:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50             # Trip if 50% of the last 10 requests fail
        slowCallRateThreshold: 75            # Trip if 75% take longer than slowCallDuration
        slowCallDurationThreshold: 2000ms    # 2 seconds considered slow
        waitDurationInOpenState: 15000ms     # Wait 15 seconds before trying half-open
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true


logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.apache.kafka.common: ERROR
    org.apache.kafka.clients: ERROR
    net.wowdev.ecommerce.orders: ${LOG_LEVEL_ORDERS_SERVICE:INFO}
    net.wowdev.ecommerce.customers: ${LOG_LEVEL_CUSTOMERS_SERVICE:INFO}
    net.wowdev.ecommerce.inventory: ${LOG_LEVEL_INVENTORY_SERVICE:INFO}
    net.wowdev.ecommerce.payments: ${LOG_LEVEL_PAYMENTS_SERVICE:DEBUG}
    net.wowdev.ecommerce.invoices: ${LOG_LEVEL_INVOICES_SERVICE:INFO}
    net.wowdev.ecommerce.shipments: ${LOG_LEVEL_SHIPMENTS_SERVICE:INFO}
    net.wowdev.ecommerce.datareplication: ${LOG_LEVEL_DATAREPLICATION:INFO}
